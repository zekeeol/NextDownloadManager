[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/desktop", "crates/service", "crates/core", "crates/cli", "crates/nmhost", "crates/mcp"]
# The fuzz targets are a workspace of their own (nightly, libFuzzer): see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["zekeeol <zekeeol@proton.me>", "Ahmed Nefzaoui"]
publish = false

[workspace.dependencies]
ndm-cli = { path = "crates/cli" }
ndm-core = { path = "crates/core" }
ndm-cnl = { path = "crates/cnl" }
ndm-crash = { path = "crates/crash", default-features = false }
ndm-debrid = { path = "crates/debrid" }
# Without its browser-like connection unless asked (the app asks: its `browser-connection`).
ndm-engine = { path = "crates/engine", default-features = false }
ndm-extract = { path = "crates/extract" }
ndm-geo = { path = "crates/geo" }
ndm-ipc = { path = "crates/ipc" }
ndm-labserver = { path = "crates/labserver" }
ndm-mcp = { path = "crates/mcp" }
ndm-remote = { path = "crates/remote" }
ndm-tools = { path = "crates/tools" }
ndm-torrent = { path = "crates/torrent" }

# storytold craft-libs (D-003), pinned by commit.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }

image = { version = "0.25.10", default-features = false, features = ["png"] }
dirs = "7.0.0"
# Gzipped IP blocklists, read to convert them for librqbit (crates/torrent blocklist.rs).
flate2 = "1.1.10"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
open = "5.4.5"

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
http-range-header = "0.4.2"
httpdate = "1.0.3"
# Checksum verification (crates/engine/src/verify.rs).
md-5 = "0.11.0"
sha1 = "0.11.0"
crc32fast = "1.5.3"
# Free space and file system per volume (disk preflight); only the disk part.
sysinfo = { version = "0.40.0", default-features = false, features = ["disk"] }
proptest = "1.12.0"
# HTTP/1.1 only: each engine worker must be one real TCP connection (notes/ENGINE.md §4).
# The browser-like connection (#668, crates/engine/src/browserlike.rs): a download whose site's
# bot check refused NDM's own connection is asked once more the way a browser connects (its TLS
# handshake, HTTP/2 settings and header order), on BoringSSL. Builds BoringSSL from source:
# CMake, a C/C++ compiler, libclang and, on Windows, NASM.
wreq = { version = "=0.16.3", default-features = false, features = ["webpki-roots", "tokio-rt", "socks", "stream", "gzip", "brotli", "zstd", "deflate"] }
# emulation-compression: the profile's own Accept-Encoding, in Chrome's place and words (#1494).
wreq-util = { version = "=0.2.1", default-features = false, features = ["emulation", "emulation-compression"] }
# Its trusted certificates: Mozilla's (as wreq's own default) and the system's, which NDM's own
# connection trusts too (an antivirus's or a company's HTTPS inspection adds its own there).
rustls-native-certs = "0.8.5"
webpki-root-certs = "1.0.11"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
# FTP and FTPS (crates/engine/src/ftp.rs), with TLS through the rustls and platform verifier
# reqwest uses. "deprecated" is what enables implicit FTPS (ftps://, port 990).
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
# Custom DNS (#36): plain DNS, DNS over TLS and over HTTPS, with aws-lc-rs (no ring) and the
# platform's certificate checks, the same as downloads. Not its system config: "the system's DNS"
# stays tokio's own lookup.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "rustls-platform-verifier"] }
# Network adapter binding (#35, crates/engine/src/net.rs): sockets held to a device (Linux) or
# an interface index (macOS) need socket2's "all"; the adapter list; the system proxy resolved
# before a bound client is built. All three are already in the tree (tokio, hyper, librqbit).
socket2 = { version = "0.6.5", features = ["all"] }
network-interface = "2.0.5"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy-system"] }
# The release signatures' RSA and Ed25519 checks (crates/tools/src/openpgp.rs): the crypto
# library rustls brings anyway, with the same features.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The MCP server (crates/mcp): the official Rust SDK, stdio only.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
# The lab FTP server's test certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
# Their dates (rcgen's own).
time = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.2", default-features = false, features = ["std", "parse", "serde"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
percent-encoding = "2.3.2"
url = { version = "2.5.8", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Whole-program optimisation in one unit: smaller and a little faster programs, for a slower
# release build (#25).
lto = "fat"
codegen-units = 1
# Function names and file:line for crash reports. The debug info doesn't ship: CI turns it into the
# release's symbols zip (tools/installer/symbols.py); Windows keeps it in the .pdb, which no
# download includes, and Linux and macOS strip it from the programs they ship.
debug = "line-tables-only"
# The whole program optimised for size (#158): with fat LTO it is optimised as one unit, at the
# program's own level, so this is what decides. It took 9 MB (21 %) off the app's program and
# 2.4 MB off the installer, for no measurable cost in a download's speed or CPU (a 2 GiB file and
# its SHA-256 from the lab server, 10 runs each: 5.2 s CPU before, 5.4 s after, within the
# runs' spread; the time is the disk's). "s" keeps loops vectorised ("z" doesn't).
opt-level = "s"

# Hashing is unusably slow unoptimised (a 3 MiB SHA-256 took seconds in debug tests): build
# the checksum crates optimised in dev too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# Dependencies' debug info: file:line only, so backtraces still name them, in debug symbols a
# fraction of the size (every test program links them all). NDM's own crates keep full debug
# info, for stepping through them in a debugger.
[profile.dev.package."*"]
debug = "line-tables-only"

[patch.crates-io]
# librqbit 9.1.0 with per-torrent rate limits that change while a torrent runs (#39), and a
# magnet lookup's progress counted (#92), and every socket bound to one address (`bind_ip`,
# #143), and every HTTP client of a session built through NDM's TLS setup (`configure_http_client`:
# a system without CA certificates), and a DHT that stops asking a bootstrap node that never
# answers once another one has, and loads its saved IPv6 nodes (#650), and a piece whose hash
# check a pause cuts short queued again instead of lost (#706), and the peers that others name
# asked of NDM before they are used (`peer_filter`), until upstream has them
# (ikatson/rqbit); every crate of that repository from the same commit.
librqbit = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-bencode = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-buffers = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-clone-to-owned = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-core = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-dht = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-lsd = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-peer-protocol = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-sha1-wrapper = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
librqbit-tracker-comms = { path = "patches/librqbit-tracker-comms" }
librqbit-upnp = { git = "https://github.com/anefzaoui/rqbit.git", rev = "c99ca4b4602e586437912bc9adecbe1111f1ee25" }
# librqbit's uTP (#1384) as merged upstream after 0.7.0, until a release has it
# (ikatson/librqbit-utp#3, #4): on Windows, one packet sent to a closed port (or one oversized
# datagram) no longer stops uTP for the whole session, and ringbuf 0.5.
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp.git", rev = "06e1c53c8df6edb2830d6aab64a6d4bed8479908" }

# Fix magnet metadata lookup announcing left=0 to HTTP/UDP trackers (which causes strict BEP 3/15
# trackers to omit seeders). Patching the git source directly lets librqbit pick up the local crate.
[patch."https://github.com/anefzaoui/rqbit.git"]
librqbit-tracker-comms = { path = "patches/librqbit-tracker-comms" }
